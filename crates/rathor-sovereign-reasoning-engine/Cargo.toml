[package]
name = "rathor-sovereign-reasoning-engine"
version = "0.1.0"
edition = "2021"
license = "AG-SML v1.1 — Autonomicity Games Sovereign Mercy License"
authors = ["The 15 PATSAGi Councils"]
description = "Struct with source literals. new sets valence to 0.99999997. MERCY_THRESHOLD is 0.9999999 (a source literal, not a measured value). evaluate_proposal returns Err below that literal."

# Standalone workspace, same pattern as crates/fenca, crates/council,
# crates/powrush, and crates/sovereign-shard-genesis.
# `cargo build --locked` and `cargo test --locked` use this manifest.
# This crate is not a root default member.
# serde and serde_json stay at the versions already written here.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
path = "src/lib.rs"