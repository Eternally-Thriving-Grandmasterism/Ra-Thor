[package]
name = "mercy_gating_runtime"
version = "14.15.0"
edition = "2021"
authors = ["Sherif Samy Botros <info@Rathor.ai>", "Eternally-Thriving-Grandmasterism"]
description = "Race amplifiers and source-literal gate thresholds. Council tuning stores Ma'at as new_value.max(650.0) and a gate as new_value.max(0.5). Those floors are source literals, not measured results. src/error.rs does not exist."
license = "AG-SML v1.1 — Autonomicity Games Sovereign Mercy License"
repository = "https://github.com/Eternally-Thriving-Grandmasterism/Ra-Thor"
keywords = ["mercy", "gating", "runtime", "tolc", "one-organism"]
categories = ["science", "simulation"]
autobins = false

# Standalone workspace, same pattern as crates/fenca, crates/council,
# crates/powrush, and crates/sovereign-shard-genesis.
# `cargo build --locked` and `cargo test --locked` use this manifest.
# This crate is not a root default member.
# src/bin/metrics_server.rs is not a binary target.
[workspace]
resolver = "2"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1.38", features = ["full"], optional = true }

[features]
default = []
serde = ["dep:serde", "dep:bincode"]
http = ["dep:axum", "dep:tokio"]

[lib]
name = "mercy_gating_runtime"
path = "src/lib.rs"
