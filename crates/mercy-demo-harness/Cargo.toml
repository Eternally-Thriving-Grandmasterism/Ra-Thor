# DEMO-HARNESS-1 (2026-10-27): offline demo harness for the Mercy gates.
# Demo-only. Not published. No network, no paid APIs, no LLM calls.
# AG-SML v1.2 | Contact: info@Rathor.ai
[package]
name = "mercy-demo-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline demo harness: sandboxed tool calls from a scripted agent, through an MCP-shaped JSON-RPC shim, gated by mercy-security and lattice-conductor-v14 prefix scoring. Demo only."
license = "AG-SML v1.2 — Autonomicity Games Sovereign Mercy License"
authors = ["Eternally-Thriving-Grandmasterism", "Sherif Samy Botros <info@Rathor.ai>"]

[dependencies]
mercy-security = { path = "../mercy-security" }
lattice-conductor-v14 = { path = "../lattice-conductor-v14" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "mercy-demo-harness"
path = "src/main.rs"
