[package]
name = "soft-sovereign-agency"
version = "0.1.0"
edition = "2021"
license = "AG-SML v1.2 — Autonomicity Games Sovereign Mercy License"
authors = ["Sherif Samy Botros <info@Rathor.ai>"]
description = "SoftSovereignAgency stores a view mode. Human starts as Poetic. AI starts as Structured. set_view_mode replaces it. src/feature_flag.rs and src/dual_path.rs are not modules."
repository = "https://github.com/Eternally-Thriving-Grandmasterism/Ra-Thor"

# Standalone workspace, same pattern as crates/fenca, crates/council,
# crates/powrush, and crates/sovereign-shard-genesis.
# `cargo build --locked` and `cargo test --locked` use this manifest.
# This crate is not a root default member.
# shared-valence-field stays a relative path dependency.
# src/feature_flag.rs and src/dual_path.rs are not modules.
[workspace]
resolver = "2"

[dependencies]
shared-valence-field = { path = "../shared-valence-field" }
serde = { version = "1.0", features = ["derive"] }
