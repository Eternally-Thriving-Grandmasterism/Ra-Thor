[package]
name = "mercy-quanta-sentinel-council"
version = "0.1.0"
edition = "2021"
authors = ["21 PATSAGi Councils under the Rathor Sovereign Reasoning Engine + MercyOS-Pinnacle & PATSAGi-Pinnacle integration"]
license = "AG-SML v1.1 — Autonomicity Games Sovereign Mercy License"
description = "21st PATSAGi Council — MercyQuanta Sentinel (9 Mercy Quanta + SoulScan-X9 emotional intent proof + DivineChecksum-9 + Sentinel Mirror + Post-Quantum ML-KEM alignment). Full TOLC 8, valence gating from PATSAGi fleet councils, RSRE v3.0 integration."

# Standalone workspace, same pattern as crates/fenca and crates/council.
# `cargo test --locked` and `cargo clippy --locked` use this manifest.
# This crate is not a root default member.
#
# STUB-AUDIT-1 REASONING-COUNCIL-WIRES-1.
# src/uncompiled_council.rs is not a module. The bytes under the
# design-only header and `#![rustfmt::skip]` are the previous src/lib.rs.
# The compiled library calls RathorSovereignReasoningEngine.
# MERCY_THRESHOLD is the source literal 0.9999999.
# philotic-web-fusion fuse_bond stores caller valence. The mean is web_valence.
# mial, mercy_gating_runtime, and mercy-threshold-wasm are not dependencies.
# Fleet, post-quantum, and 100B-year phrases in the package description are design intent.
[workspace]
resolver = "2"

[dependencies]
rathor-sovereign-reasoning-engine = { path = "../rathor-sovereign-reasoning-engine", version = "0.1.0" }
philotic-web-fusion = { path = "../philotic-web-fusion", version = "0.3.0" }

[lib]
path = "src/lib.rs"
