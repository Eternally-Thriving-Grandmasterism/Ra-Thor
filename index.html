<style>
body { font-family: 'Inter', system-ui, sans-serif; }
.thunder-glow { text-shadow: 0 0 28px rgba(252,211,77,0.45), 0 0 56px rgba(245,158,11,0.25); }
    .card-hover { transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.35s ease, border-color 0.35s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -16px rgba(234,179,8,0.45); }
    .golden-star { position:absolute; color:#ffd700; opacity:0.22; pointer-events:none; animation:float 90s infinite linear; z-index:1; font-size:16px; }
    .kicker { letter-spacing: 0.01em; }
    .lang-tab { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); min-height: 44px; white-space: normal; text-align: center; line-height: 1.3; }
    .lang-tab.active { background-color: #fcd34d !important; color: #000000 !important; border-color: #fcd34d !important; box-shadow: 0 0 25px #fcd34d; }
    .lattice-status { background: linear-gradient(90deg, #1a1a1a, #111); border: 1px solid #ffd70033; }
    .faq-accordion { direction: inherit; text-align: start; }
    .faq-accordion details { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
    .faq-accordion details[open] { border-color: rgba(240, 211, 106, 0.45); box-shadow: 0 12px 28px -16px rgba(201, 162, 39, 0.35); }
    .faq-accordion summary { cursor: pointer; list-style: none; display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: flex-start; align-items: flex-start; gap: 0.7rem; text-align: start; }
    .faq-accordion summary::-webkit-details-marker { display: none; }
    .faq-accordion details[open] summary { color: var(--rt-gold); text-shadow: none; }
    .faq-accordion .lightning-icon { flex: 0 0 auto; line-height: 1.45; }
    .faq-accordion summary .faq-q { flex: 1 1 auto; min-width: 0; text-align: start; line-height: 1.45; font-weight: 650; letter-spacing: 0.04em; text-decoration: none; }
    .faq-accordion .faq-content { margin-top: 0.85rem; padding-inline-start: 1.85rem; text-align: start; }
    .lightning-icon { transition: all 0.3s ease; }
    details[open] .lightning-icon { animation: thunderBolt 0.6s ease infinite alternate; }
    @keyframes float { 0%{transform:translateY(0) rotate(0deg);} 100%{transform:translateY(-120vh) rotate(360deg);} }
    @keyframes thunderBolt { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.15) rotate(8deg); } }
    #faq[dir="rtl"], .faq-accordion.rtl { direction: ltr; text-align: start; }
    html[dir="rtl"] .faq-accordion summary, #faq[dir="rtl"] .faq-accordion summary { flex-direction: row; }
    @media (prefers-reduced-motion: reduce) {
      .golden-star, .card-hover, .lightning-icon, details[open] .lightning-icon { animation: none !important; transition: none !important; }
    }
