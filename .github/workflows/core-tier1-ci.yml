name: Core Tier-1 CI (ONE Organism + Kardashev path)

# Default PR/main gate. TIER_MAP: focused -p tests, not cargo test --workspace.
# Runs on every main push/PR so Tier 1 stays actually green (path filters were skipping it).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tier1-tests:
    name: Tier-1 package tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test lattice-conductor-v14
        run: cargo test -p lattice-conductor-v14 -- --nocapture

      - name: Test reality-thriving-transfer
        run: cargo test -p reality-thriving-transfer -- --nocapture

      - name: Test kardashev-orchestration
        run: cargo test -p kardashev-orchestration -- --nocapture

      - name: Test ra-thor-one-organism (default / facade)
        run: cargo test -p ra-thor-one-organism -- --nocapture

      - name: Test github-connector
        run: cargo test -p github-connector -- --nocapture

      - name: Test gpu-compute-pipeline
        run: cargo test -p gpu-compute-pipeline -- --nocapture

      - name: Test quantum-swarm
        run: cargo test -p quantum-swarm -- --nocapture

      - name: Test sovereign-recovery
        run: cargo test -p sovereign-recovery -- --nocapture

      - name: Test ra-thor-monorepo-intelligence
        run: cargo test -p ra-thor-monorepo-intelligence -- --nocapture

      - name: Test mercy_tolc_operator_algebra
        run: cargo test -p mercy_tolc_operator_algebra -- --nocapture

      - name: Test fractal-mercy-ledger-adapter (Tier 2 bridge)
        run: cargo test -p fractal-mercy-ledger-adapter -- --nocapture

      - name: Check live-feature gates (compile only)
        run: |
          cargo check -p ra-thor-one-organism --features kardashev-live
          cargo check -p ra-thor-one-organism --features recovery-live
          cargo check -p ra-thor-one-organism --features quantum-live
          cargo check -p ra-thor-one-organism --features gpu-live
          cargo check -p ra-thor-one-organism --features web-demo
