name: Validate

on:
  # Parked: Validate/web-forge always-red. Opt-in only.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: crates/web-forge/package.json

    - name: Install dependencies
      working-directory: crates/web-forge
      run: npm install

    - name: Run lint
      working-directory: crates/web-forge
      run: npm run lint

    - name: Run build
      working-directory: crates/web-forge
      run: npm run build

    - name: Run validation
      working-directory: crates/web-forge
      run: npm run validate