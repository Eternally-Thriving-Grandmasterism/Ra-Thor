name: Batch PR Scoring

on:
  # Parked: wrong package/bin (ra-thor-monorepo-intelligence / no batch_pr_scorer_cli).
  workflow_dispatch:

jobs:
  score-batch-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build scorer
        run: cargo build --package monorepo-intelligence --bin batch_pr_scorer_cli

      - name: Get changed files
        id: changed
        run: |
          git diff --name-only origin/main...HEAD > changed_files.txt
          echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Run Batch PR Scorer
        id: score
        run: |
          if [ -s changed_files.txt ]; then
            ./target/debug/batch_pr_scorer_cli $(cat changed_files.txt) > score_output.txt || true
            echo "output=$(cat score_output.txt | head -c 2500)" >> $GITHUB_OUTPUT
          else
            echo "output=## Automated Batch PR Scoring\n\nNo significant changes detected. This appears to be a documentation or minor update." >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const output = '${{ steps.score.outputs.output }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output + '\n\n> Powered by monorepo-intelligence::BatchPrScorer | Eternal Iteration Protocol'
            });
