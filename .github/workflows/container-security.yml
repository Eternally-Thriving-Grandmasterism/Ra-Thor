name: Mercy Container Security Scan

on:
  # Parked: container/Trivy scan is leftover always-red. Opt-in only.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for SARIF uploads

jobs:
  container-scan:
    runs-on: ubuntu-latest
    name: Scan containers & Dockerfiles

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # needed for Trivy repo scanning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'  # fail on critical/high

      - name: Upload Trivy SARIF (filesystem)
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: trivy-fs.sarif

      - name: Hadolint – Dockerfile linting
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: |
            **/Dockerfile
            **/Dockerfile.*
          failure-threshold: error

      - name: Grype vulnerability scanner (if Dockerfiles present)
        if: contains(github.event.head_commit.modified, 'Dockerfile') || contains(github.event.head_commit.added, 'Dockerfile')
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          fail-build: true
          severity-cutoff: high

      - name: Mercy-approved – Container security scan passed
        if: success()
        run: echo "All container gates cleared – image safe for deployment"

      - name: Mercy shield – Container security failure
        if: failure()
        run: |
          echo "Mercy shield activated: Container security scan failed"
          exit 1
