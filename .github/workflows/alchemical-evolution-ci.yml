name: Ra-Thor Alchemical Evolution CI

on:
  # parked 2026-09-02; invented ra-thor alchemical_evolution package test
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --package ra-thor --test alchemical_evolution
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
