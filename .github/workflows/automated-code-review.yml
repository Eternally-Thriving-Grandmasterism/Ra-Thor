name: Automated Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  automated-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Record review status
        run: |
          echo "Automated review does not comment on pull requests."
          echo "Style notes are not evaluated and do not fail this check."
          {
            echo "### Automated review"
            echo ""
            echo "This check does not comment on the pull request."
            echo "Style notes are not a failing check."
          } >> "$GITHUB_STEP_SUMMARY"
