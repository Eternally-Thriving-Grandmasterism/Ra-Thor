name: shard-composer

# Standalone workspace. Not a root member. This job is the build for that crate.
on:
  pull_request:

permissions:
  contents: read

jobs:
  locked-tests:
    name: shard-composer locked tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust 1.89.0
        # dtolnay/rust-toolchain SHA pin 599c45df1a24c1c63ae1129a7e59f46654b8fb66 (toolchain 1.89.0)
        uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66
        with:
          toolchain: 1.89.0

      - name: Test shard-composer
        run: cargo test --locked --manifest-path crates/shard-composer/Cargo.toml
