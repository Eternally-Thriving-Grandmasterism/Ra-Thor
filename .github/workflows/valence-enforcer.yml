name: Valence Enforcer

# Audits scripts/valence-enforcer-corpus.txt with crates/fenca.
# The job prints each file's audit_score (a fraction of four checks).
# It does not write a valence constant. Missing inputs, tool errors,
# parse failures, and a failed audit fail the job.

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  enforce_valence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Audit corpus with fenca
        run: bash scripts/check-valence-enforcer.sh
