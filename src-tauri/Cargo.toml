[package]
name = "rathor-lattice"
version = "0.1.0"
description = "Rathor™ Eternal Mercy Lattice Desktop"
authors = ["Sherif Botros <@AlphaProMega>"]
license = "AG-SML v1.1 — Autonomicity Games Sovereign Mercy License"
repository = "https://github.com/Eternally-Thriving-Grandmasterism/Rathor-NEXi"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [ "protocol-asset", "shell-open" ] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-updater = { version = "2" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
